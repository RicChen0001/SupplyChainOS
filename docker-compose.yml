services:
  db:
    image: postgres:16-alpine
    container_name: supplychainos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplychainos}
      POSTGRES_USER: ${POSTGRES_USER:-supplychainos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-supplychainos} -d $${POSTGRES_DB:-supplychainos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplychainos-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-supplychainos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-supplychainos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplychainos-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    # In production image nginx proxies /api -> backend:8080 (same-origin, no CORS).

volumes:
  postgres_data:
