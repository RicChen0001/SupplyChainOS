spring:
  application:
    name: supplychainos
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/supplychainos}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:supplychainos}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change-me-in-local-env}}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    cookie:
      http-only: true
      same-site: lax
      secure: ${SESSION_COOKIE_SECURE:false}
    timeout: 8h
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.northstar: INFO
    org.hibernate.SQL: WARN

# Dev-only seed credentials. Never set a real password here; override via env in local dev only.
app:
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@northstar.demo}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    # No default password is committed. Seeding is skipped when blank (see DevDataSeeder).
    admin-name: ${SEED_ADMIN_NAME:Demo Admin}
